name: Desktop Release (Wails)

on:
  push:
    branches: [main]
    paths: ['VERSION']

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.11.0

jobs:
  prepare:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_exists: ${{ steps.release.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${#VERSION}" -gt 64 ] || ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION must be a SemVer-like value of at most 64 characters"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release existence
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${APP_VERSION}")"
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::release existence check failed with HTTP $STATUS"
              exit 1
              ;;
          esac

  build:
    needs: prepare
    if: needs.prepare.outputs.release_exists == 'false'
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact_name: omni-money-macos
          - os: windows-latest
            platform: windows/amd64
            artifact_name: omni-money-windows
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: omni-money-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify checkout did not persist credentials
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "::error::checkout credential remained in local git config"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.12'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'

      # Linux: WebKitGTK 依存パッケージ（Ubuntu 24.04+ は 4.1）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Wails CLI
        shell: bash
        run: |
          REQUIRED_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          if [ "$REQUIRED_VERSION" != "$WAILS_VERSION" ]; then
            echo "::error::go.mod Wails version ($REQUIRED_VERSION) does not match $WAILS_VERSION"
            exit 1
          fi
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Build application
        shell: bash
        run: |
          TAGS=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAGS="-tags webkit2_41"
          fi
          wails build -platform ${{ matrix.platform }} \
            $TAGS \
            -ldflags "-X main.version=${{ env.APP_VERSION }}"

      # ad-hoc署名はバンドル整合性のためで、Developer IDによる配布元証明ではない。
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          codesign --force --deep -s - "Omni Money.app"
          codesign --verify --strict "Omni Money.app"
          ditto -c -k --sequesterRsrc --keepParent "Omni Money.app" "../../${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.zip"

      # Linuxの場合: バイナリをtar.gz圧縮
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar czf ../../${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.tar.gz omni_money

      # Windowsの場合: exeをzip圧縮
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\bin\omni_money.exe" -DestinationPath "${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.*
          retention-days: 1

  attest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: >-
      needs.prepare.outputs.release_exists == 'false' &&
      needs.build.result == 'success'
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/**/*.zip
            dist/**/*.tar.gz

  release:
    needs: [prepare, build, attest]
    runs-on: ubuntu-latest
    if: >-
      needs.prepare.outputs.release_exists == 'false' &&
      needs.build.result == 'success' &&
      needs.attest.result == 'success'
    permissions:
      actions: read
      contents: write
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Generate checksums
        shell: bash
        run: |
          CHECKSUM_FILE="$(mktemp)"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PRERELEASE_FLAG=""
          if echo "${{ env.APP_VERSION }}" | grep -q '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          cat > /tmp/release-notes.md << 'NOTES_EOF'
          ## Omni Money v${{ env.APP_VERSION }}

          ### ダウンロード
          - **macOS (Apple Silicon / Intel)**: `omni-money-macos-v${{ env.APP_VERSION }}.zip`
          - **Windows**: `omni-money-windows-v${{ env.APP_VERSION }}.zip`
          - **Linux**: `omni-money-linux-v${{ env.APP_VERSION }}.tar.gz`

          ### 署名と検証
          現在のmacOS／Windows成果物には、Developer ID／Authenticodeによる配布元署名がありません。
          `SHA256SUMS` とGitHub artifact attestationを検証し、出所を確認できない成果物は実行しないでください。
          macOSの隔離属性を削除するコマンドは推奨しません。

          ### Docker
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}
          ```
          NOTES_EOF

          gh release create "v${{ env.APP_VERSION }}" \
            --title "Omni Money v${{ env.APP_VERSION }}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_FLAG \
            $(find dist/ -type f)
