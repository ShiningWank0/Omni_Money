name: Desktop Release (Wails)

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'frontend/src/**'
      - 'frontend/wailsjs/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/vite.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'build/**'
      - 'scripts/build-openssl-darwin.sh'
      - 'scripts/build-sqlcipher-*.sh'
      - 'go.mod'
      - 'go.sum'
      - 'wails.json'
      - '.github/workflows/release-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/release-desktop.yml'

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.11.0

jobs:
  prepare:
    name: Validate and test release
    permissions:
      contents: read # required to inspect the release-triggering source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_exists: ${{ steps.release.outputs.exists || steps.pull_request.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(awk 'END { print NR }' VERSION)" != 1 ]; then
            echo "::error::VERSION must contain exactly one line"
            exit 1
          fi
          VERSION="$(sed -n '1p' VERSION)"
          semver_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "${#VERSION}" -gt 64 ] || [[ ! "$VERSION" =~ $semver_re ]]; then
            echo "::error::VERSION is not valid SemVer"
            exit 1
          fi
          if [[ "$VERSION" == *+* ]]; then
            echo "::error::Release versions must not contain SemVer build metadata (+...); Docker and desktop artifacts use the same version"
            exit 1
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go for release quality gate
        if: github.event_name == 'push'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.7'

      - name: Setup Node.js for release quality gate
        if: github.event_name == 'push'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'

      - name: Install Linux build dependencies
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install and audit frontend dependencies
        if: github.event_name == 'push'
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build

      - name: Run release quality gate
        if: github.event_name == 'push'
        run: |
          go test ./...
          go vet ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -severity medium ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Check release existence
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${APP_VERSION}")"
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release existence check failed with HTTP $STATUS"; exit 1 ;;
          esac

      - name: Enable artifact build for pull request
        id: pull_request
        if: github.event_name == 'pull_request'
        run: echo "exists=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build desktop artifacts
    needs: prepare
    if: needs.prepare.outputs.release_exists == 'false'
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin/amd64
            artifact_name: omni-money-macos-amd64
            deployment_target: '10.13'
          - os: macos-15
            platform: darwin/arm64
            artifact_name: omni-money-macos-arm64
            deployment_target: '11.0'
          - os: windows-latest
            platform: windows/amd64
            artifact_name: omni-money-windows
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact_name: omni-money-linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify checkout did not persist credentials
        shell: bash
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "::error::checkout credential remained in local git config"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.7'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'

      - name: Setup MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            curl
            tcl
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl

      # Linux: WebKitGTK 依存パッケージ（Ubuntu 24.04+ は 4.1）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl tcl libssl-dev binutils file libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install tcl-tk

      - name: Install Wails CLI
        shell: bash
        run: |
          REQUIRED_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          if [ "$REQUIRED_VERSION" != "$WAILS_VERSION" ]; then
            echo "::error::go.mod Wails version ($REQUIRED_VERSION) does not match $WAILS_VERSION"
            exit 1
          fi
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"

      - name: Build pinned static SQLCipher on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          SQLCIPHER_LIBRARY_KIND: static
          SQLCIPHER_PREFIX: ${{ runner.temp }}/omni-sqlcipher-4.18.0
        run: sh scripts/build-sqlcipher-linux.sh

      - name: Build pinned static OpenSSL and SQLCipher on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          OPENSSL_PREFIX: ${{ runner.temp }}/omni-openssl-3.5.8
          SQLCIPHER_PREFIX: ${{ runner.temp }}/omni-sqlcipher-4.18.0
        run: |
          bash scripts/build-openssl-darwin.sh
          bash scripts/build-sqlcipher-darwin.sh

      - name: Build pinned static SQLCipher on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SQLCIPHER_PREFIX: /ucrt64/omni-sqlcipher-4.18.0
        run: sh scripts/build-sqlcipher-windows.sh

      - name: Test Windows SQLCipher snapshot transaction lifecycle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SQLCIPHER_PREFIX: /ucrt64/omni-sqlcipher-4.18.0
          OMNI_REQUIRE_SQLCIPHER_TESTS: "1"
        run: |
          export CC=gcc
          export CGO_ENABLED=1
          SQLCIPHER_WINDOWS="$(cygpath -m "$SQLCIPHER_PREFIX")"
          OPENSSL_WINDOWS="$(cygpath -m /ucrt64)"
          export CGO_CFLAGS="-I${SQLCIPHER_WINDOWS}/include -I${OPENSSL_WINDOWS}/include"
          export CGO_LDFLAGS="-L${SQLCIPHER_WINDOWS}/lib ${OPENSSL_WINDOWS}/lib/libcrypto.a -lws2_32 -lcrypt32 -lgdi32"
          go test -count=1 -tags "libsqlite3 sqlite_omit_load_extension" \
            -run '^(TestEncryptedDatabaseSnapshotAndRestoreLifecycle|TestStartupRecoveryRestoresSoleBackupBeforeFreshCreate|TestStartupRecoveryReplacesCorruptLiveWithValidBackup|TestSnapshotPruneJournalRollsBackPreparedQuarantine|TestCreateSnapshotRecoversPreparedPruneJournalBeforeNewTransaction|TestPublishedPruneFinalizeStateMatrixIsCrashIdempotent|TestListSnapshotsCandidateLifetimeSerializesAcrossProcesses|TestSnapshotTransactionLockSerializesConcurrentOwners|TestListValidationAnchorBlocksWindowsCandidateReplacement|TestSnapshotTransactionLockRejectsUnsafeWindowsRootAndPrivacyDrift|TestSyncOpenRestoreCandidateSupportsWindowsFlush|TestValidateSnapshotDACLAllowsDistinctOwnerPrincipalSets)$' \
            ./backend/database

      - name: Build application on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          SQLCIPHER_PREFIX: ${{ runner.temp }}/omni-sqlcipher-4.18.0
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          export CGO_ENABLED=1
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CGO_CFLAGS="-I${SQLCIPHER_PREFIX}/include"
            export CGO_LDFLAGS="-L${SQLCIPHER_PREFIX}/lib -lcrypto"
            BUILD_TAGS="webkit2_41,libsqlite3,sqlite_omit_load_extension"
          else
            OPENSSL_PREFIX="${{ runner.temp }}/omni-openssl-3.5.8"
            export CGO_CFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -I${SQLCIPHER_PREFIX}/include -I${OPENSSL_PREFIX}/include"
            export CGO_LDFLAGS="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET} -L${SQLCIPHER_PREFIX}/lib ${OPENSSL_PREFIX}/lib/libcrypto.a -framework Security -framework CoreFoundation -framework UniformTypeIdentifiers"
            BUILD_TAGS="libsqlite3,sqlite_omit_load_extension"
          fi
          "$(go env GOPATH)/bin/wails" build -platform "$BUILD_PLATFORM" \
            -tags "$BUILD_TAGS" \
            -ldflags "-X main.version=${APP_VERSION}"

      - name: Build application on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SQLCIPHER_PREFIX: /ucrt64/omni-sqlcipher-4.18.0
        run: |
          export CC=gcc
          export CGO_ENABLED=1
          SQLCIPHER_WINDOWS="$(cygpath -m "$SQLCIPHER_PREFIX")"
          OPENSSL_WINDOWS="$(cygpath -m /ucrt64)"
          WAILS_EXE="$(cygpath -u "$(go env GOPATH)")/bin/wails.exe"
          export CGO_CFLAGS="-I${SQLCIPHER_WINDOWS}/include -I${OPENSSL_WINDOWS}/include"
          export CGO_LDFLAGS="-L${SQLCIPHER_WINDOWS}/lib ${OPENSSL_WINDOWS}/lib/libcrypto.a -lws2_32 -lcrypt32 -lgdi32"
          "$WAILS_EXE" build -platform "$BUILD_PLATFORM" \
            -tags "libsqlite3,sqlite_omit_load_extension" \
            -ldflags "-X main.version=${APP_VERSION}"

      - name: Verify macOS SQLCipher linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BINARY="build/bin/Omni Money.app/Contents/MacOS/omni_money"
          "$BINARY" --self-test-sqlcipher
          DEPENDENCIES="$(otool -L "$BINARY")"
          printf '%s\n' "$DEPENDENCIES"
          if printf '%s\n' "$DEPENDENCIES" | grep -Eiq 'lib(sqlite3|crypto|ssl)|homebrew|cellar|${{ runner.temp }}'; then
            echo "::error::macOS artifact contains a forbidden dynamic or build-host dependency"
            exit 1
          fi

      - name: Verify Linux SQLCipher linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY build/bin/omni_money --self-test-sqlcipher
          readelf -d build/bin/omni_money | tee /tmp/omni-money-readelf.txt
          if grep -Eiq 'NEEDED.*sqlite3|RPATH|RUNPATH|${{ runner.temp }}' /tmp/omni-money-readelf.txt; then
            echo "::error::Linux artifact contains a forbidden SQLite or build-host dependency"
            exit 1
          fi
          grep -Eq 'NEEDED.*libcrypto\.so\.3' /tmp/omni-money-readelf.txt

      - name: Verify Windows SQLCipher linkage
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          SYSTEM_ROOT="$(cygpath -u "$SYSTEMROOT")"
          PATH="$SYSTEM_ROOT/System32:$SYSTEM_ROOT" ./build/bin/omni_money.exe --self-test-sqlcipher
          objdump -p build/bin/omni_money.exe | grep 'DLL Name:' | tee /tmp/omni-money-imports.txt
          while IFS= read -r dll; do
            dll="$(printf '%s' "$dll" | tr '[:upper:]' '[:lower:]')"
            case "$dll" in
              api-ms-win-*.dll|ext-ms-win-*.dll|advapi32.dll|bcrypt.dll|comctl32.dll|comdlg32.dll|crypt32.dll|dwmapi.dll|gdi32.dll|imm32.dll|kernel32.dll|msvcrt.dll|ntdll.dll|ole32.dll|oleaut32.dll|rpcrt4.dll|secur32.dll|setupapi.dll|shell32.dll|shlwapi.dll|shcore.dll|user32.dll|userenv.dll|uxtheme.dll|version.dll|winhttp.dll|winmm.dll|ws2_32.dll|wtsapi32.dll)
                ;;
              *)
                echo "non-system DLL import in Windows artifact: $dll" >&2
                exit 1
                ;;
            esac
          done < <(sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p' /tmp/omni-money-imports.txt | tr -d '\r')

      # macOSの場合: ad-hoc署名 + dittoでバンドル構造保持ZIP
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          codesign --force --deep -s - "Omni Money.app"
          codesign --verify --strict "Omni Money.app"
          ditto -c -k --sequesterRsrc --keepParent "Omni Money.app" "../../${ARTIFACT_NAME}-v${APP_VERSION}.zip"

      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          destination="$(mktemp -d)"
          ditto -x -k "${ARTIFACT_NAME}-v${APP_VERSION}.zip" "$destination"
          codesign --verify --strict "$destination/Omni Money.app"
          "$destination/Omni Money.app/Contents/MacOS/omni_money" --self-test-sqlcipher

      # Linuxの場合: バイナリをtar.gz圧縮
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar czf "../../${ARTIFACT_NAME}-v${APP_VERSION}.tar.gz" omni_money

      - name: Verify packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          destination="$(mktemp -d)"
          tar xzf "${ARTIFACT_NAME}-v${APP_VERSION}.tar.gz" -C "$destination"
          env -u DISPLAY -u WAYLAND_DISPLAY "$destination/omni_money" --self-test-sqlcipher

      # Windowsの場合: exeをzip圧縮
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = "$env:ARTIFACT_NAME-v$env:APP_VERSION.zip"
          Compress-Archive -Path "build\bin\omni_money.exe" -DestinationPath $destination

      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'omni-money-packaged'
          Expand-Archive -Path "$env:ARTIFACT_NAME-v$env:APP_VERSION.zip" -DestinationPath $destination
          $originalPath = $env:Path
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            $process = Start-Process `
              -FilePath (Join-Path $destination 'omni_money.exe') `
              -ArgumentList '--self-test-sqlcipher' `
              -NoNewWindow `
              -PassThru
            if (-not $process.WaitForExit(60000)) {
              $process.Kill()
              $process.WaitForExit()
              throw 'packaged SQLCipher self-test timed out'
            }
            if ($process.ExitCode -ne 0) { throw 'packaged SQLCipher self-test failed' }
          } finally {
            $env:Path = $originalPath
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.*
          retention-days: 1

  attest:
    name: Attest desktop artifacts
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'push' &&
      needs.prepare.outputs.release_exists == 'false' &&
      needs.build.result == 'success'
    permissions:
      actions: read # required to download build artifacts
      contents: read # required by actions/attest provenance metadata
      id-token: write # signs provenance through GitHub OIDC
      attestations: write # publishes the artifact attestations
      artifact-metadata: write # links attestations to GitHub artifact metadata

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/**/*.zip
            dist/**/*.tar.gz

  release:
    name: Publish GitHub release
    needs: [prepare, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'push' &&
      needs.prepare.outputs.release_exists == 'false' &&
      needs.build.result == 'success' &&
      needs.attest.result == 'success'
    permissions:
      actions: read # required to download build artifacts
      contents: write # required only for creating the GitHub Release
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Generate checksums
        shell: bash
        run: |
          CHECKSUM_FILE="$(mktemp)"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_FLAGS=()
          RELEASE_CORE="${APP_VERSION%%+*}"
          if [[ "$RELEASE_CORE" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          cat > /tmp/release-notes.md << NOTES_EOF
          ## Omni Money v${APP_VERSION}

          ### ダウンロード
          - **macOS (Apple Silicon)**: \`omni-money-macos-arm64-v${APP_VERSION}.zip\`
          - **macOS (Intel)**: \`omni-money-macos-amd64-v${APP_VERSION}.zip\`
          - **Windows**: \`omni-money-windows-v${APP_VERSION}.zip\`
          - **Linux**: \`omni-money-linux-v${APP_VERSION}.tar.gz\`

          ### 署名と検証
          現在のmacOS／Windows成果物には、Developer ID／Authenticodeによる配布元署名がありません。
          \`SHA256SUMS\` とGitHub artifact attestationを検証し、出所を確認できない成果物は実行しないでください。

          ### Docker
          \`\`\`bash
          docker pull ghcr.io/${RELEASE_REPOSITORY}:${APP_VERSION}
          \`\`\`
          NOTES_EOF

          for artifact_dir in omni-money-macos-arm64 omni-money-macos-amd64 omni-money-windows omni-money-linux; do
            if [ ! -d "dist/$artifact_dir" ]; then
              echo "::error::missing release artifact directory: $artifact_dir"
              exit 1
            fi
            artifact_count="$(find "dist/$artifact_dir" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print | wc -l | tr -d '[:space:]')"
            if [ "$artifact_count" -ne 1 ]; then
              echo "::error::expected exactly one packaged artifact in $artifact_dir, found $artifact_count"
              exit 1
            fi
          done
          mapfile -d '' RELEASE_FILES < <(find dist/ -type f -print0)
          gh release create "v${APP_VERSION}" \
            --repo "$RELEASE_REPOSITORY" \
            --title "Omni Money v${APP_VERSION}" \
            --notes-file /tmp/release-notes.md \
            "${RELEASE_FLAGS[@]}" \
            "${RELEASE_FILES[@]}"
