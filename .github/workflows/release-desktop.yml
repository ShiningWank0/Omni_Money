name: Desktop Release (Wails)

on:
  push:
    branches: [main]
    paths: ['VERSION']

permissions: {}

jobs:
  build:
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact_name: omni-money-macos
          - os: windows-latest
            platform: windows/amd64
            artifact_name: omni-money-windows
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: omni-money-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.APP_VERSION }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'

      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'

      # Linux: WebKitGTK 依存パッケージ（Ubuntu 24.04+ は 4.1）
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && steps.check_release.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        if: steps.check_release.outputs.exists == 'false'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build application
        if: steps.check_release.outputs.exists == 'false'
        shell: bash
        run: |
          TAGS=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAGS="-tags webkit2_41"
          fi
          wails build -platform ${{ matrix.platform }} \
            $TAGS \
            -ldflags "-X main.version=${{ env.APP_VERSION }}"

      # ad-hoc署名はバンドル整合性のためで、Developer IDによる配布元証明ではない。
      - name: Package macOS app
        if: runner.os == 'macOS' && steps.check_release.outputs.exists == 'false'
        run: |
          cd build/bin
          codesign --force --deep -s - "Omni Money.app"
          codesign --verify --strict "Omni Money.app"
          ditto -c -k --sequesterRsrc --keepParent "Omni Money.app" "../../${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.zip"

      # Linuxの場合: バイナリをtar.gz圧縮
      - name: Package Linux app
        if: runner.os == 'Linux' && steps.check_release.outputs.exists == 'false'
        run: |
          cd build/bin
          tar czf ../../${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.tar.gz omni_money

      # Windowsの場合: exeをzip圧縮
      - name: Package Windows app
        if: runner.os == 'Windows' && steps.check_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\bin\omni_money.exe" -DestinationPath "${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.zip"

      - name: Upload artifact
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}-v${{ env.APP_VERSION }}.*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.APP_VERSION }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/

      - name: Generate checksums
        if: steps.check_release.outputs.exists == 'false'
        shell: bash
        run: |
          CHECKSUM_FILE="$(mktemp)"
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" dist/SHA256SUMS

      - name: Attest release artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/**/*
            dist/SHA256SUMS

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PRERELEASE_FLAG=""
          if echo "${{ env.APP_VERSION }}" | grep -q '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          cat > /tmp/release-notes.md << 'NOTES_EOF'
          ## Omni Money v${{ env.APP_VERSION }}

          ### ダウンロード
          - **macOS (Apple Silicon / Intel)**: `omni-money-macos-v${{ env.APP_VERSION }}.zip`
          - **Windows**: `omni-money-windows-v${{ env.APP_VERSION }}.zip`
          - **Linux**: `omni-money-linux-v${{ env.APP_VERSION }}.tar.gz`

          ### 署名と検証
          現在のmacOS／Windows成果物には、Developer ID／Authenticodeによる配布元署名がありません。
          `SHA256SUMS` とGitHub artifact attestationを検証し、出所を確認できない成果物は実行しないでください。
          macOSの隔離属性を削除するコマンドは推奨しません。

          ### Docker
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}
          ```
          NOTES_EOF

          gh release create "v${{ env.APP_VERSION }}" \
            --title "Omni Money v${{ env.APP_VERSION }}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_FLAG \
            $(find dist/ -type f)
