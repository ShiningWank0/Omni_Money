name: Docker Release

on:
  pull_request:
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - '.node-version'
      - 'frontend/**'
      - 'backend/**'
      - server.go
      - 'scripts/build-sqlcipher-*.sh'
      - '.github/workflows/release-docker.yml'
  push:
    branches: [main]
    paths: ['VERSION']

permissions: {}

concurrency:
  group: docker-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-check:
    name: Verify release build actions
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build release image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          platforms: ${{ matrix.platform }}
          build-args: VERSION=pr-validation
          outputs: type=oci,dest=${{ runner.temp }}/omni-money.tar
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.platform }}

  prepare:
    name: Validate and scan release
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(awk 'END { print NR }' VERSION)" != 1 ]; then
            echo "::error::VERSION must contain exactly one line"
            exit 1
          fi
          VERSION="$(sed -n '1p' VERSION)"
          semver_re='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "${#VERSION}" -gt 64 ] || [[ ! "$VERSION" =~ $semver_re ]]; then
            echo "::error::VERSION is not valid SemVer"
            exit 1
          fi
          if [[ "$VERSION" == *+* ]]; then
            echo "::error::Docker tags do not support SemVer build metadata (+...); use a release version without build metadata"
            exit 1
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Go for release quality gate
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node.js for release quality gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install and audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build

      - name: Run release quality gate
        run: |
          go test ./...
          go vet ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -severity medium ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -severity medium -tags server ./...
          go test -race ./...
          go test -race -tags server ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -tags server ./...

  build:
    name: Build architecture image
    needs: prepare
    permissions:
      contents: read
      packages: write # pushes the per-architecture GHCR images
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single platform)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ needs.prepare.outputs.image }}:${{ env.APP_VERSION }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: VERSION=${{ env.APP_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Scan the exact digest that was just pushed. Scanning a separately
      # rebuilt candidate would not cover the published artifact, and this step
      # runs for both architectures before the multi-arch manifest exists.
      - name: Scan pushed architecture digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  manifest:
    name: Publish multi-architecture manifest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write # publishes the final multi-architecture GHCR manifest
      id-token: write # signs the build provenance attestation
      attestations: write # records the attestation for gh attestation verify
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Create and push multi-arch manifest
        id: publish
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ env.APP_VERSION }}
        run: |
          # buildx imagetools はOCI image index（Buildxが生成する形式）を正しく処理できる
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          if [[ "$VERSION" != *-* ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          else
            echo "Skipping :latest for prerelease ${VERSION}"
          fi

          # Hash the exact raw index manifest instead of trusting a buildx
          # template, whose output format has changed across buildx releases.
          digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" | sha256sum | awk '{print $1}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::could not compute the published image digest"
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The action records the attestation with the repository and mirrors it
      # into GHCR using the default github.token plus this job's packages:write.
      - name: Attest published image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Report published digest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ env.APP_VERSION }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Published image"
            echo ""
            echo "- Tag: \`${IMAGE}:${VERSION}\`"
            echo "- Digest-pinned reference: \`${IMAGE}@${DIGEST}\`"
            echo "- Provenance: verified with \`scripts/resolve-image-digest.sh --verify --repo ${GITHUB_REPOSITORY}\`"
            echo ""
            echo "Deploy with:"
            echo ""
            echo '```'
            echo "sudo scripts/safe-update.sh ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
