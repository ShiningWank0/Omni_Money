name: Wails development diagnostics (manual, Issue 299)

# Issue #299: wait for the official Wails fix before restoring this to required CI.
# Keep the real browser and vulnerability findings strict in this manual workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -tags=gtk3

jobs:
  browser:
    name: Development runtime (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/shiningwank0/omni_money-build-ubuntu@sha256:c5cc269d8a8c44832c022bce56258e9434a49665246ec2b467753c7205bec752
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --user 1001:1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [assets, vite]
    env:
      CGO_ENABLED: "1"
      CGO_CFLAGS: -I/tmp/omni-sqlcipher/include
      CGO_LDFLAGS: -L/tmp/omni-sqlcipher/lib -lcrypto
      LD_LIBRARY_PATH: /tmp/omni-sqlcipher/lib
      VITE_OSS_TARGET: desktop-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify frozen Linux package inventory
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/verify-linux-environment.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install reviewed npm for frontend builds
        working-directory: ${{ github.workspace }}
        run: node scripts/setup-ci-npm.mjs

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build checksum-pinned SQLCipher
        env:
          SQLCIPHER_PREFIX: /tmp/omni-sqlcipher
          SQLCIPHER_BUILD_JOBS: "2"
        run: sh scripts/build-sqlcipher-linux.sh
      - name: Install browser
        working-directory: frontend
        run: npx --no-install playwright install chromium
      - name: Install selected Wails CLI
        if: matrix.mode == 'vite'
        run: |
          node scripts/install-wails-v3.mjs
          node scripts/wails-dev-evidence.mjs cli "$(go env GOPATH)/bin/wails3"

      - name: Build and inspect development binary
        id: build
        run: |
          OMNI_CI_BROWSER_BINARY="$RUNNER_TEMP/omni-wails-dev" node scripts/build-wails-browser.mjs
          mkdir -p .oss-cache/wails-dev-results
          node scripts/wails-dev-build.mjs "$RUNNER_TEMP/omni-wails-dev" linux/amd64 browser > .oss-cache/wails-dev-results/selected-build.json
      - name: Scan development call graph
        if: ${{ !cancelled() && matrix.mode == 'assets' && steps.build.outcome == 'success' }}
        run: node scripts/security-reports.mjs govulncheck-dev
      - name: Test actual development runtime
        id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        env:
          INTEGRATION_MODE: ${{ matrix.mode }}
        run: |
          timeout --signal=TERM --kill-after=20s 600s xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" dbus-run-session -- node scripts/wails-dev-integration.mjs "$RUNNER_TEMP/omni-wails-dev" "$INTEGRATION_MODE"
      - name: Require complete integration evidence
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        env:
          INTEGRATION_MODE: ${{ matrix.mode }}
        run: node scripts/wails-dev-evidence.mjs result "$INTEGRATION_MODE"
      - name: Verify dependency manifests stayed unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- go.mod go.sum
      - name: Save integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wails-echo-dev-${{ matrix.mode }}-${{ github.run_attempt }}
          path: .oss-cache/wails-dev-results/
          if-no-files-found: error
          retention-days: 7
      - name: Save development security report
        if: ${{ always() && matrix.mode == 'assets' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dev-${{ github.run_attempt }}
          path: security-reports/govulncheck-dev.json
          if-no-files-found: error
          retention-days: 7
