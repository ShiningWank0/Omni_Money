name: Wails development browser integration (manual)

# Temporary until Wails/browser and Echo compatibility is verified (Issue #299).
# Restore this test to normal CI when that Issue's return conditions are met.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wails-dev-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Test real Wails and Echo development runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Linux dependencies
        run: |
          sudo python3 scripts/ci_ubuntu_apt.py
          sudo apt-get update
          sudo apt-get install -y build-essential curl tcl libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11
      - name: Build frontend assets
        env:
          VITE_OSS_TARGET: desktop-linux-amd64
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build checksum-pinned SQLCipher
        env:
          SQLCIPHER_PREFIX: /tmp/omni-sqlcipher
          SQLCIPHER_BUILD_JOBS: "2"
        run: sh scripts/build-sqlcipher-linux.sh
      - name: Install browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Test actual Wails development runtime with the selected Echo
        id: wails-dev
        timeout-minutes: 8
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/tmp/omni-sqlcipher/include
          CGO_LDFLAGS: -L/tmp/omni-sqlcipher/lib -lcrypto
          LD_LIBRARY_PATH: /tmp/omni-sqlcipher/lib
        run: |
          set -euo pipefail
          WAILS_TEST_BUILD_DIR="$(mktemp -d "$RUNNER_TEMP/omni-wails-build.XXXXXX")"
          trap 'rm -rf "$WAILS_TEST_BUILD_DIR"' EXIT
          go build -mod=readonly -tags "dev,desktop,webkit2_41,libsqlite3,sqlite_omit_load_extension" -o "$WAILS_TEST_BUILD_DIR/omni-wails-dev" .
          timeout --signal=TERM --kill-after=15s 180s xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" dbus-run-session -- node scripts/wails-dev-integration.mjs "$WAILS_TEST_BUILD_DIR/omni-wails-dev"
          git diff --exit-code -- go.mod go.sum
      - name: Save Wails and Echo integration evidence
        if: ${{ always() && steps.wails-dev.outcome != '' && steps.wails-dev.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wails-echo-dev-integration
          path: .oss-cache/wails-dev-results/
          if-no-files-found: warn
          retention-days: 7
