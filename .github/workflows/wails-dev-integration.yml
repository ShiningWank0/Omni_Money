name: Wails and Echo development compatibility

# Issue #299 remains open until the real browser runtime passes these checks.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Development runtime (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [assets, vite]
    env:
      CGO_ENABLED: "1"
      CGO_CFLAGS: -I/tmp/omni-sqlcipher/include
      CGO_LDFLAGS: -L/tmp/omni-sqlcipher/lib -lcrypto
      LD_LIBRARY_PATH: /tmp/omni-sqlcipher/lib
      VITE_OSS_TARGET: desktop-linux-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl tcl libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build checksum-pinned SQLCipher
        env:
          SQLCIPHER_PREFIX: /tmp/omni-sqlcipher
          SQLCIPHER_BUILD_JOBS: "2"
        run: sh scripts/build-sqlcipher-linux.sh
      - name: Install browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Install selected Wails CLI
        if: matrix.mode == 'vite'
        run: |
          set -euo pipefail
          WAILS_VERSION="$(go list -mod=readonly -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          [[ "$WAILS_VERSION" =~ ^v2\.[0-9]+\.[0-9]+$ ]]
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
          node scripts/wails-dev-evidence.mjs cli "$(go env GOPATH)/bin/wails"
      - name: Build and inspect development binary
        id: build
        run: |
          go build -mod=readonly -tags "dev,desktop,webkit2_41,libsqlite3,sqlite_omit_load_extension" -o "$RUNNER_TEMP/omni-wails-dev" .
          mkdir -p .oss-cache/wails-dev-results
          node scripts/wails-dev-build.mjs "$RUNNER_TEMP/omni-wails-dev" > .oss-cache/wails-dev-results/selected-build.json
      - name: Scan development call graph
        if: ${{ !cancelled() && matrix.mode == 'assets' && steps.build.outcome == 'success' }}
        run: node scripts/security-reports.mjs govulncheck-dev
      - name: Test actual development runtime
        id: integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 12
        env:
          INTEGRATION_MODE: ${{ matrix.mode }}
        run: |
          timeout --signal=TERM --kill-after=20s 600s xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" dbus-run-session -- node scripts/wails-dev-integration.mjs "$RUNNER_TEMP/omni-wails-dev" "$INTEGRATION_MODE"
      - name: Require complete integration evidence
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        env:
          INTEGRATION_MODE: ${{ matrix.mode }}
        run: node scripts/wails-dev-evidence.mjs result "$INTEGRATION_MODE"
      - name: Verify dependency manifests stayed unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- go.mod go.sum
      - name: Save integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wails-echo-dev-${{ matrix.mode }}-${{ github.run_attempt }}
          path: .oss-cache/wails-dev-results/
          if-no-files-found: error
          retention-days: 7
      - name: Save development security report
        if: ${{ always() && matrix.mode == 'assets' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dev-${{ github.run_attempt }}
          path: security-reports/govulncheck-dev.json
          if-no-files-found: error
          retention-days: 7
