name: Capture immutable build environments

on:
  push:
    branches: [fix/capture-native-environments]
    paths:
      - .github/workflows/capture-build-environments.yml
      - build/environments/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: capture-build-environments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Capture ${{ matrix.environment }} / ${{ matrix.arch }}
    if: github.repository == 'ShiningWank0/Omni_Money'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [ubuntu, alpine-builder, alpine-runtime]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build candidate without registry write credentials
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p export
          docker version > export/capture-tools.txt
          docker build --no-cache --platform "linux/$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f "build/environments/$ENVIRONMENT.Dockerfile" -t omni-environment:candidate .
          docker run --rm --entrypoint /bin/sh omni-environment:candidate -c \
            'cat /etc/os-release; uname -m; openssl version 2>/dev/null || true' > export/runtime.txt
          cid="$(docker create omni-environment:candidate true)"
          docker cp "$cid:/opt/omni-environment" export/inventory
          docker rm "$cid"
          docker save omni-environment:candidate | gzip -1 > export/image.tar.gz
          sha256sum export/image.tar.gz > export/archive.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-${{ matrix.environment }}-${{ matrix.arch }}
          path: export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Capture complete MSYS2 UCRT64 environment
    if: github.repository == 'ShiningWank0/Omni_Money'
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: base-devel curl tcl perl mingw-w64-ucrt-x86_64-toolchain
      - name: Preserve the coherent package set and metadata
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p /opt/omni-environment
          pacman -Q > /opt/omni-environment/packages.txt
          # Keep the exact installed payloads, not just a list of package names.
          mapfile -t packages < <(pacman -Q | awk '{print $1 "=" $2}')
          pacman -Sw --noconfirm "${packages[@]}"
          find /var/cache/pacman/pkg -type f -exec sha256sum {} + > /opt/omni-environment/packages.sha256
          cp -a /var/lib/pacman/sync /opt/omni-environment/repository-metadata
          out="$(cygpath -u "$RUNNER_TEMP")/msys2-export"
          mkdir -p "$out"
          cp /opt/omni-environment/packages.txt "$out/"
          tar --exclude='./proc' --exclude='./tmp' --exclude='./dev' \
            -I 'gzip -1' -cf "$out/msys64.tar.gz" -C / .
          (cd "$out" && sha256sum msys64.tar.gz > archive.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-msys2-amd64
          path: ${{ runner.temp }}/msys2-export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-linux:
    name: Preserve Linux candidate in GHCR
    needs: linux
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [ubuntu, alpine-builder, alpine-runtime]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: environment-${{ matrix.environment }}-${{ matrix.arch }}
          path: candidate
      - name: Publish already-built data; never run candidate code with write permission
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(sha256sum candidate/image.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 candidate/archive.sha256)"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gzip -dc candidate/image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}-build-$ENVIRONMENT"
          tag="$GITHUB_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag omni-environment:candidate "$image:$tag"
          docker push "$image:$tag"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")"
          mkdir -p result
          jq -n --arg ref "$ref" --arg source "$GITHUB_SHA" --arg arch "$ARCH" \
            --arg env "$ENVIRONMENT" --arg run "$GITHUB_RUN_ID" \
            '{schema:1,environment:$env,arch:$arch,image:$ref,sourceCommit:$source,runId:$run}' > result/lock.json
          echo 'OMNI_ENV_LOCK_BEGIN'
          cat result/lock.json
          echo 'OMNI_ENV_LOCK_END'
          cat result/lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-${{ matrix.environment }}-${{ matrix.arch }}
          path: result/lock.json
          if-no-files-found: error

  publish-windows:
    name: Preserve MSYS2 candidate in GHCR
    needs: windows
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: environment-msys2-amd64
          path: candidate
      - name: Publish archive as immutable OCI artifact
        working-directory: candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check --strict archive.sha256
          curl --fail --location --retry 3 \
            https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz -o oras.tar.gz
          echo '66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0  oras.tar.gz' | sha256sum --check --strict
          tar -xzf oras.tar.gz oras
          printf '%s' "$REGISTRY_TOKEN" | ./oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}-build-msys2"
          tag="$GITHUB_SHA-amd64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ./oras push --artifact-type application/vnd.omni-money.msys2.v1 \
            "$image:$tag" msys64.tar.gz:application/gzip packages.txt:text/plain archive.sha256:text/plain
          digest="$(./oras manifest fetch --descriptor "$image:$tag" | jq -er .digest)"
          jq -n --arg ref "$image@$digest" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg archive "$(cut -d' ' -f1 archive.sha256)" \
            '{schema:1,environment:"msys2",arch:"amd64",artifact:$ref,archiveSHA256:$archive,sourceCommit:$source,runId:$run}' > lock.json
          echo 'OMNI_ENV_LOCK_BEGIN'
          cat lock.json
          echo 'OMNI_ENV_LOCK_END'
          cat lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-msys2-amd64
          path: candidate/lock.json
          if-no-files-found: error
