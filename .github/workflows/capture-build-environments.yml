name: Capture immutable build environments

on:
  push:
    branches: [fix/capture-native-environments]
    paths:
      - .github/workflows/capture-build-environments.yml
      - build/environments/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: capture-build-environments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Capture ${{ matrix.environment }} / ${{ matrix.arch }}
    if: github.repository == 'ShiningWank0/Omni_Money'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [alpine-builder, alpine-runtime]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build candidate without registry write credentials
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p export
          docker version > export/capture-tools.txt
          docker build --no-cache --platform "linux/$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f "build/environments/$ENVIRONMENT.Dockerfile" -t omni-environment:candidate .
          docker run --rm --entrypoint /bin/sh omni-environment:candidate -c \
            'cat /etc/os-release; uname -m; openssl version 2>/dev/null || true' > export/runtime.txt
          cid="$(docker create omni-environment:candidate true)"
          docker cp "$cid:/opt/omni-environment" export/inventory
          docker rm "$cid"
          docker save omni-environment:candidate | gzip -1 > export/image.tar.gz
          sha256sum export/image.tar.gz > export/archive.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-${{ matrix.environment }}-${{ matrix.arch }}
          path: export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7


  publish-linux:
    name: Preserve Linux candidate in GHCR
    needs: linux
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: [alpine-builder, alpine-runtime]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: environment-${{ matrix.environment }}-${{ matrix.arch }}
          path: candidate
      - name: Publish already-built data; never run candidate code with write permission
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(sha256sum candidate/image.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 candidate/archive.sha256)"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gzip -dc candidate/image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}-build-$ENVIRONMENT"
          tag="$GITHUB_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag omni-environment:candidate "$image:$tag"
          docker push "$image:$tag"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")"
          mkdir -p result
          jq -n --arg ref "$ref" --arg source "$GITHUB_SHA" --arg arch "$ARCH" \
            --arg env "$ENVIRONMENT" --arg run "$GITHUB_RUN_ID" \
            '{schema:1,environment:$env,arch:$arch,image:$ref,sourceCommit:$source,runId:$run}' > result/lock.json
          echo 'OMNI_ENV_LOCK_BEGIN'
          cat result/lock.json
          echo 'OMNI_ENV_LOCK_END'
          cat result/lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-${{ matrix.environment }}-${{ matrix.arch }}
          path: result/lock.json
          if-no-files-found: error

  publish-index:
    name: Preserve multi-architecture environment indexes
    needs: publish-linux
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-lock-*
          path: candidates
      - name: Assemble indexes from the saved architecture digests
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir result
          for kind in alpine-builder alpine-runtime; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-build-$kind"
            tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            sources=()
            for arch in amd64 arm64; do
              source="$(jq -er .image "candidates/candidate-lock-$kind-$arch/lock.json")"
              [[ "$source" =~ ^"$image"@sha256:[a-f0-9]{64}$ ]]
              sources+=("$source")
            done
            docker buildx imagetools create --tag "$image:$tag" "${sources[@]}"
            digest="sha256:$(docker buildx imagetools inspect --raw "$image:$tag" | sha256sum | cut -d' ' -f1)"
            jq -n --arg ref "$image@$digest" --arg source "$GITHUB_SHA" --arg env "$kind" \
              --arg run "$GITHUB_RUN_ID" \
              '{schema:1,environment:$env,platforms:["linux/amd64","linux/arm64"],image:$ref,sourceCommit:$source,runId:$run}' > "result/$kind.json"
            echo 'OMNI_ENV_LOCK_BEGIN'
            cat "result/$kind.json"
            echo 'OMNI_ENV_LOCK_END'
            cat "result/$kind.json" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-linux-indexes
          path: result/
          if-no-files-found: error

