name: Capture immutable build environments

on:
  push:
    branches: [fix/buildkit-alpine-security]
    paths:
      - .github/workflows/capture-build-environments.yml
      - build/environments/**
  workflow_dispatch:
    inputs:
      buildkit_only:
        description: Capture only the patched BuildKit image
        type: boolean
        default: false

permissions: {}

concurrency:
  group: capture-build-environments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Capture ${{ matrix.environment }} / ${{ matrix.arch }}
    if: github.repository == 'ShiningWank0/Omni_Money'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON((inputs.buildkit_only || github.event_name == 'push') && '["buildkit"]' || '["ubuntu","alpine-builder","alpine-runtime"]') }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.environment == 'ubuntu' && 180 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build candidate without registry write credentials
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p export
          docker version > export/capture-tools.txt
          docker build --no-cache --platform "linux/$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f "build/environments/$ENVIRONMENT.Dockerfile" -t omni-environment:candidate .
          docker run --rm --entrypoint /bin/sh omni-environment:candidate -c \
            'cat /etc/os-release; uname -m; openssl version 2>/dev/null || true' > export/runtime.txt
          cid="$(docker create omni-environment:candidate true)"
          docker cp "$cid:/opt/omni-environment" export/inventory
          docker rm "$cid"
          docker save omni-environment:candidate | gzip -1 > export/image.tar.gz
          sha256sum export/image.tar.gz > export/archive.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-${{ matrix.environment }}-${{ matrix.arch }}
          path: export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Capture complete MSYS2 UCRT64 environment
    if: github.repository == 'ShiningWank0/Omni_Money' && !(inputs.buildkit_only || github.event_name == 'push')
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: curl diffutils make tcl perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-tcl
      - name: Preserve the coherent package set and metadata
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # Native builds use curl. The bootstrap base metapackage requires
          # wget, but has no binaries of its own. Keep all other base tools.
          if pacman -Q wget >/dev/null 2>&1; then
            remove=(wget)
            for meta in base base-devel; do
              if pacman -Q "$meta" >/dev/null 2>&1; then remove+=("$meta"); fi
            done
            pacman -R --noconfirm "${remove[@]}"
          fi
          pacman -Dk
          # SQLCipher configure uses Tcl to resolve the native compiler paths
          # that restore-fixed-msys2 exports for C and C++.
          UCRT_BIN="$(cygpath -m /ucrt64/bin)" tclsh <<'TCL'
          foreach compiler {gcc.exe g++.exe} {
            if {![file executable [file join $::env(UCRT_BIN) $compiler]]} {
              error "Native Tcl cannot resolve $compiler in $::env(UCRT_BIN)"
            }
          }
          TCL
          for unused in wget mingw-w64-ucrt-x86_64-python; do
            if pacman -Q "$unused" >/dev/null 2>&1; then exit 1; fi
          done
          rm -f /var/cache/pacman/pkg/wget-*.pkg.tar.* /var/cache/pacman/pkg/mingw-w64-ucrt-x86_64-python-*.pkg.tar.*
          mkdir -p /opt/omni-environment
          pacman -Q > /opt/omni-environment/packages.txt
          # Keep the exact installed payloads, not just a list of package names.
          mapfile -t packages < <(pacman -Q | awk '{print $1 "=" $2}')
          pacman -Sw --noconfirm "${packages[@]}"
          find /var/cache/pacman/pkg -type f -exec sha256sum {} + > /opt/omni-environment/packages.sha256
          cp -a /var/lib/pacman/sync /opt/omni-environment/repository-metadata
          out="$(cygpath -u "$RUNNER_TEMP")/msys2-export"
          mkdir -p "$out"
          cp /opt/omni-environment/packages.txt "$out/"
          tar --exclude='./proc' --exclude='./tmp' --exclude='./dev' \
            -I 'gzip -1' -cf "$out/msys64.tar.gz" -C / .
          (cd "$out" && sha256sum msys64.tar.gz > archive.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-msys2-amd64
          path: ${{ runner.temp }}/msys2-export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-linux:
    name: Preserve Linux candidate in GHCR
    needs: linux
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON((inputs.buildkit_only || github.event_name == 'push') && '["buildkit"]' || '["ubuntu","alpine-builder","alpine-runtime"]') }}
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: environment-${{ matrix.environment }}-${{ matrix.arch }}
          path: candidate
      - name: Publish already-built data; never run candidate code with write permission
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(sha256sum candidate/image.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 candidate/archive.sha256)"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gzip -dc candidate/image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}-build-$ENVIRONMENT"
          tag="$GITHUB_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag omni-environment:candidate "$image:$tag"
          docker push "$image:$tag"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")"
          mkdir -p result
          jq -n --arg ref "$ref" --arg source "$GITHUB_SHA" --arg arch "$ARCH" \
            --arg env "$ENVIRONMENT" --arg run "$GITHUB_RUN_ID" \
            '{schema:1,environment:$env,arch:$arch,image:$ref,sourceCommit:$source,runId:$run}' > result/lock.json
          echo 'OMNI_ENV_LOCK_BEGIN'
          cat result/lock.json
          echo 'OMNI_ENV_LOCK_END'
          cat result/lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-${{ matrix.environment }}-${{ matrix.arch }}
          path: result/lock.json
          if-no-files-found: error

  publish-index:
    name: Preserve multi-architecture environment indexes
    needs: publish-linux
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-lock-*
          path: candidates
      - name: Assemble indexes from the saved architecture digests
        env:
          ENVIRONMENTS: ${{ (inputs.buildkit_only || github.event_name == 'push') && 'buildkit' || 'ubuntu alpine-builder alpine-runtime' }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir result
          for kind in $ENVIRONMENTS; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-build-$kind"
            tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            sources=()
            for arch in amd64 arm64; do
              source="$(jq -er .image "candidates/candidate-lock-$kind-$arch/lock.json")"
              [[ "$source" =~ ^"$image"@sha256:[a-f0-9]{64}$ ]]
              sources+=("$source")
            done
            docker buildx imagetools create --tag "$image:$tag" "${sources[@]}"
            digest="sha256:$(docker buildx imagetools inspect --raw "$image:$tag" | sha256sum | cut -d' ' -f1)"
            jq -n --arg ref "$image@$digest" --arg source "$GITHUB_SHA" --arg env "$kind" \
              --arg run "$GITHUB_RUN_ID" \
              '{schema:1,environment:$env,platforms:["linux/amd64","linux/arm64"],image:$ref,sourceCommit:$source,runId:$run}' > "result/$kind.json"
            echo 'OMNI_ENV_LOCK_BEGIN'
            cat "result/$kind.json"
            echo 'OMNI_ENV_LOCK_END'
            cat "result/$kind.json" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-linux-indexes
          path: result/
          if-no-files-found: error

  publish-windows:
    name: Preserve MSYS2 candidate in GHCR
    needs: windows
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: environment-msys2-amd64
          path: candidate
      - name: Publish archive as immutable OCI artifact
        working-directory: candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check --strict archive.sha256
          curl --fail --location --retry 3 \
            https://github.com/oras-project/oras/releases/download/v1.4.0/oras_1.4.0_linux_amd64.tar.gz -o oras.tar.gz
          echo 'd8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1  oras.tar.gz' | sha256sum --check --strict
          tar -xzf oras.tar.gz oras
          printf '%s' "$REGISTRY_TOKEN" | ./oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}-build-msys2"
          tag="$GITHUB_SHA-amd64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ./oras push --artifact-type application/vnd.omni-money.msys2.v1 \
            "$image:$tag" msys64.tar.gz:application/gzip packages.txt:text/plain archive.sha256:text/plain
          digest="$(./oras manifest fetch --descriptor "$image:$tag" | jq -er .digest)"
          jq -n --arg ref "$image@$digest" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg archive "$(cut -d' ' -f1 archive.sha256)" \
            '{schema:1,environment:"msys2",arch:"amd64",artifact:$ref,archiveSHA256:$archive,sourceCommit:$source,runId:$run}' > lock.json
          echo 'OMNI_ENV_LOCK_BEGIN'
          cat lock.json
          echo 'OMNI_ENV_LOCK_END'
          cat lock.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock-msys2-amd64
          path: candidate/lock.json
          if-no-files-found: error
