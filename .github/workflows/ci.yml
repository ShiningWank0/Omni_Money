name: CI

on:
  # Stacked PRs use non-main base branches; run the same checks for every PR.
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'update/**'
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl tcl libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend assets for Go embed
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build checksum-pinned SQLCipher
        env:
          SQLCIPHER_PREFIX: /tmp/omni-sqlcipher
          SQLCIPHER_BUILD_JOBS: "2"
        run: sh scripts/build-sqlcipher-linux.sh

      - name: Test fail-closed SQLCipher integration
        env:
          CGO_CFLAGS: -I/tmp/omni-sqlcipher/include
          CGO_LDFLAGS: -L/tmp/omni-sqlcipher/lib
          LD_LIBRARY_PATH: /tmp/omni-sqlcipher/lib
          OMNI_REQUIRE_SQLCIPHER_TESTS: "1"
        run: go test -count=1 -tags "libsqlite3 sqlite_omit_load_extension" ./backend/securedb ./backend/database ./backend/control ./backend/vault ./backend/desktopaccount ./backend/api
      - name: Cross-build Windows secret boundaries
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go test -c ./backend/secretfile -o /tmp/secretfile-windows.test.exe
          GOOS=windows GOARCH=amd64 go test -c ./backend/aicredentials -o /tmp/aicredentials-windows.test.exe
          GOOS=windows GOARCH=amd64 go test -c ./backend/fileprivacy -o /tmp/fileprivacy-windows.test.exe

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go security analyzer
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -severity medium ./...

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -no-color

      - name: Run Go race tests
        run: go test -race ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build SQLCipher-linked server entrypoint
        env:
          CGO_CFLAGS: -I/tmp/omni-sqlcipher/include
          CGO_LDFLAGS: -L/tmp/omni-sqlcipher/lib
          LD_LIBRARY_PATH: /tmp/omni-sqlcipher/lib
        run: go build -tags "server libsqlite3 sqlite_omit_load_extension" -o /tmp/omni_money_server ./server.go

      - name: Validate Docker Compose configuration
        env:
          ALLOWED_HOSTS: 'money.example.com'
          PASSKEY_RP_ID: 'money.example.com'
          PASSKEY_ORIGINS: 'https://money.example.com'
          OMNI_AT_REST_ATTESTATION_FILE: '/tmp/omni-data-at-rest.json'
          OMNI_UPDATE_ATTESTATION_FILE: '/tmp/omni-update-attestation.json'
          OMNI_CONTROL_DB_ENCRYPTION_KEY_FILE: '/tmp/omni-control-database.key'
          OMNI_INITIAL_ADMIN_SETUP_TOKEN_FILE: '/tmp/omni-initial-admin-setup.token'
        run: |
          docker compose config --quiet
          docker compose config --format json | jq -e '.name == "omni-money"'
          docker compose -f compose.yaml -f compose.bootstrap.yaml config --quiet
          docker compose -f compose.yaml -f compose.bootstrap.yaml -f compose.local.yaml config --quiet
          test -x scripts/safe-update.sh
          bash -n scripts/safe-update.sh
          test -x scripts/safe-update_test.sh
          # Production refuses non-root before touching Docker or data. Run
          # the critical legacy and parser-drift paths in isolation first so
          # their diagnostics stay focused, then run the complete transaction
          # matrix under the same root boundary. Fixture-only mocks remain
          # confined to each generated test path.
          sudo env "PATH=$PATH" SAFE_UPDATE_ONLY=legacy_archive_failure SAFE_UPDATE_EXPECTED=1 scripts/safe-update_test.sh
          sudo env "PATH=$PATH" SAFE_UPDATE_ONLY=jq_only_drift SAFE_UPDATE_EXPECTED=1 scripts/safe-update_test.sh
          sudo env "PATH=$PATH" SAFE_UPDATE_ONLY=candidate_ingress_health_failure SAFE_UPDATE_EXPECTED=1 scripts/safe-update_test.sh
          sudo env "PATH=$PATH" scripts/safe-update_test.sh

      - name: Assert Pangolin network isolation
        env:
          ALLOWED_HOSTS: 'money.example.com'
          PASSKEY_RP_ID: 'money.example.com'
          PASSKEY_ORIGINS: 'https://money.example.com'
          OMNI_AT_REST_ATTESTATION_FILE: '/tmp/omni-data-at-rest.json'
          OMNI_UPDATE_ATTESTATION_FILE: '/tmp/omni-update-attestation.json'
          OMNI_CONTROL_DB_ENCRYPTION_KEY_FILE: '/tmp/omni-control-database.key'
          OMNI_INITIAL_ADMIN_SETUP_TOKEN_FILE: '/tmp/omni-initial-admin-setup.token'
        run: |
          set -euo pipefail
          base_config="$(mktemp)"
          local_config="$(mktemp)"
          bootstrap_config="$(mktemp)"
          trap 'rm -f "$base_config" "$local_config" "$bootstrap_config"' EXIT

          docker compose config --format json > "$base_config"
          docker compose -f compose.yaml -f compose.local.yaml config --format json > "$local_config"
          docker compose -f compose.yaml -f compose.bootstrap.yaml config --format json > "$bootstrap_config"

          # The default deployment must be reachable only through the shared
          # Pangolin/Newt network and must not publish any host port.
          jq -e '
            .services["omni-money"].ports == null and
            .services["omni-money"].expose == ["4000"] and
            .services["omni-money"].user == "10001:10001" and
            .services["omni-money"].runtime == "runc" and
            .services["omni-money"].environment.CONTROL_DB_PATH == "/app/data/control/omni_control.db" and
            .services["omni-money"].environment.CONTROL_DB_ENCRYPTION_KEY_FILE == "/run/secrets/omni_control_database_key" and
            .services["omni-money"].environment.VAULT_ROOT == "/app/data/vaults" and
            (.services["omni-money"].environment | has("INITIAL_ADMIN_SETUP_TOKEN_FILE") | not) and
            (.secrets | has("omni_initial_admin_setup_token") | not) and
            .services["omni-money"].environment.FORCE_HTTPS == "true" and
            .services["omni-money"].environment.ALLOW_INSECURE_HTTP == "false" and
            .services["omni-money"].environment.TRUSTED_PROXIES == "172.30.240.3/32" and
            .services["omni-money"].environment.ALLOWED_HOSTS == "money.example.com" and
            .services["omni-money"].environment.PASSKEY_RP_ID == "money.example.com" and
            .services["omni-money"].environment.PASSKEY_ORIGINS == "https://money.example.com" and
            (.services["omni-money"].networks | keys) == ["pangolin_target"] and
            .services["omni-money"].networks.pangolin_target.ipv4_address == "172.30.240.2" and
            .networks.pangolin_target.internal == true and
            .networks.pangolin_target.name == "omni-money-pangolin" and
            .networks.pangolin_target.ipam.config[0].subnet == "172.30.240.0/28" and
            .services["omni-money"].read_only == true and
            .services["omni-money"].cap_drop == ["ALL"] and
            .services["omni-money"].security_opt == ["no-new-privileges:true"]
          ' "$base_config"

          # The local override may publish only the Web listener on IPv4
          # loopback. It must never publish the AI listener.
          jq -e '
            .services["omni-money"].environment.FORCE_HTTPS == "false" and
            .services["omni-money"].environment.ALLOW_INSECURE_HTTP == "true" and
            .services["omni-money"].environment.WEB_EXTERNAL_HOST == "127.0.0.1" and
            .services["omni-money"].environment.TRUSTED_PROXIES == "" and
            .services["omni-money"].environment.ALLOWED_HOSTS == "localhost:4000,127.0.0.1:4000" and
            .services["omni-money"].environment.PASSKEY_RP_ID == "localhost" and
            .services["omni-money"].environment.PASSKEY_ORIGINS == "http://localhost:4000" and
            (.services["omni-money"].ports | length) == 1 and
            .services["omni-money"].ports[0].target == 4000 and
            .services["omni-money"].ports[0].published == "4000" and
            .services["omni-money"].ports[0].host_ip == "127.0.0.1"
          ' "$local_config"

          # The one-time setup token exists only in the explicit bootstrap
          # overlay and can be retired without breaking later base restarts.
          jq -e '
            .services["omni-money"].environment.INITIAL_ADMIN_SETUP_TOKEN_FILE == "/run/secrets/omni_initial_admin_setup_token" and
            .secrets.omni_initial_admin_setup_token != null and
            ([.services["omni-money"].secrets[].source] | index("omni_initial_admin_setup_token")) != null
          ' "$bootstrap_config"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test frontend security boundaries
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-security:
    name: Windows security boundaries
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Verify Windows owner-only storage boundaries
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 ./backend/fileprivacy
          go test -count=1 -run '^TestWindows' ./backend/desktopaccount/platform_shared.go ./backend/desktopaccount/platform_windows.go ./backend/desktopaccount/platform_windows_test.go
          go test -count=1 -run '^TestWindowsPreparePrivateDatabaseFileSetsCurrentOwner$' ./backend/database/private_database_file.go ./backend/database/private_file_windows.go ./backend/database/private_database_file_windows_test.go
          go test -count=1 -run '^TestPrepareDesktopSQLCipherSelfTestStorageIsPrivateBeforeOpen$' ./desktop_sqlcipher_storage.go ./desktop_sqlcipher_selftest_test.go

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build pinned multi-stage image
        run: docker build --build-arg VERSION=ci --tag omni-money:ci .

      - name: Assert non-root multi-vault runtime
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh omni-money:ci -c '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test -x /app/omni_money_server
            test ! -e /app/omni-totp
          '
          docker image inspect omni-money:ci | jq -e '
            .[0].Config.ExposedPorts == {"4000/tcp": {}} and
            .[0].Config.User == "omni"
          '

      - name: Smoke test hardened runtime
        run: |
          set -euo pipefail
          runtime_data="$(mktemp -d)"
          attestation_file="$(mktemp)"
          control_key_file="$(mktemp)"
          setup_token_file="$(mktemp)"
          docker_run_error="$(mktemp)"
          container_id=""
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true; sudo rm -rf "$runtime_data"; sudo rm -f "$attestation_file" "$control_key_file" "$setup_token_file" "$docker_run_error"' EXIT
          chmod 700 "$runtime_data"
          sudo chown 10001:10001 "$runtime_data"
          jq -n \
            --arg data_root "/app/data" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg recovery_tested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg next_rotation_at "$(date -u -d '+180 days' +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              version: 1,
              protection: "external-encrypted-volume",
              provider: "ci-ephemeral-volume",
              data_root: $data_root,
              key_id: "ci-ephemeral-volume-2026",
              verified_at: $verified_at,
              recovery_tested_at: $recovery_tested_at,
              next_rotation_at: $next_rotation_at
            }' > "$attestation_file"
          head -c 32 /dev/urandom | base64 > "$control_key_file"
          head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n' > "$setup_token_file"
          # Docker Compose secrets are mounted root-owned and world-readable
          # inside the container. The reader accepts this only below
          # /run/secrets; native deployments still use UID 10001 and mode 0400.
          sudo chown 0:0 "$attestation_file" "$control_key_file" "$setup_token_file"
          sudo chmod 0444 "$attestation_file" "$control_key_file" "$setup_token_file"

          if ! container_id="$(docker run -d \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --health-interval 1s \
            --health-start-period 20s \
            --health-timeout 2s \
            --health-retries 10 \
            --mount "type=bind,src=$runtime_data,dst=/app/data" \
            --mount "type=bind,src=$attestation_file,dst=/run/secrets/omni_data_at_rest_attestation.json,readonly" \
            --mount "type=bind,src=$control_key_file,dst=/run/secrets/omni_control_database_key,readonly" \
            --mount "type=bind,src=$setup_token_file,dst=/run/secrets/omni_initial_admin_setup_token,readonly" \
            --env CONTROL_DB_PATH=/app/data/control/omni_control.db \
            --env CONTROL_DB_ENCRYPTION_KEY_FILE=/run/secrets/omni_control_database_key \
            --env VAULT_ROOT=/app/data/vaults \
            --env INITIAL_ADMIN_SETUP_TOKEN_FILE=/run/secrets/omni_initial_admin_setup_token \
            --env DATA_AT_REST_MODE=external-encrypted-volume \
            --env DATA_AT_REST_ATTESTATION_FILE=/run/secrets/omni_data_at_rest_attestation.json \
            --env HOST_IP=127.0.0.1 \
            --env ALLOWED_HOSTS=127.0.0.1:4000 \
            omni-money:ci 2>"$docker_run_error")"; then
            cat "$docker_run_error"
            exit 1
          fi

          for _ in $(seq 1 90); do
            if ! health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null)"; then
              docker ps -a --no-trunc
              docker logs "$container_id" || true
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              if sudo head -c 16 "$runtime_data/control/omni_control.db" | LC_ALL=C grep -q "SQLite format 3"; then
                echo "database retained a plaintext SQLite header"
                exit 1
              fi
              sudo test -d "$runtime_data/vaults"
              echo "hardened runtime is healthy with an encrypted control database"
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker inspect --format '{{json .State}}' "$container_id" || true
              docker inspect --format '{{json .State.Health}}' "$container_id" || true
              docker logs "$container_id" || true
              exit 1
            fi
            sleep 1
          done
          docker inspect --format '{{json .State}}' "$container_id" || true
          docker inspect --format '{{json .State.Health}}' "$container_id" || true
          docker logs "$container_id" || true
          exit 1

      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: omni-money:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
