version: 2
updates:
  # Group routine version updates. Security updates keep their own policy.
  # Major versions and dependencies requiring coordinated migrations stay
  # in individual PRs; excluding from a group does not ignore the dependency.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-modules-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: [minor, patch]
        exclude-patterns:
          - "github.com/wailsapp/wails/v2"
          - "github.com/go-webauthn/*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: [minor, patch]

  # Workflow actions are pinned by commit SHA; Dependabot proposes new pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images are pinned by tag@sha256 in the Dockerfile; Dependabot proposes
  # updated digests. Each proposal still passes the CI digest-pinning tests.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns: [golang, node]
