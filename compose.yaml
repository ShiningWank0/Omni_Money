name: omni-money

services:
  omni-money:
    build:
      context: .
    image: "${OMNI_IMAGE:-omni-money:local}"
    container_name: omni-money
    # Pin the kernel credential numerically. A named USER is resolved from the
    # candidate image's /etc/passwd and therefore is not a host-side security
    # boundary during safe-update.
    user: "10001:10001"
    # Do not allow a daemon-level alternative runtime to reinterpret the
    # container isolation contract.
    runtime: runc
    restart: unless-stopped
    # The Pangolin deployment is intentionally HTTPS-at-the-edge only. The
    # trusted Newt address below is fixed on the private network so an
    # arbitrary peer cannot inject forwarded headers. See the network comment
    # before changing the subnet or either fixed address.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${OMNI_CPU_LIMIT:-2.0}"
    mem_limit: "${OMNI_MEMORY_LIMIT:-1g}"
    pids_limit: "${OMNI_PIDS_LIMIT:-256}"
    logging:
      driver: json-file
      options:
        max-size: "${OMNI_LOG_MAX_SIZE:-10m}"
        max-file: "${OMNI_LOG_MAX_FILES:-3}"
    # Pangolin/Newt から同じ Docker network 上のサービス名で接続する。
    # ホストへの ports 公開は行わない。ローカル開発時だけ compose.local.yaml
    # を重ねて、Webポートを127.0.0.1へ公開する。
    expose:
      - "4000"
    environment:
      CONTROL_DB_PATH: /app/data/control/omni_control.db
      CONTROL_DB_ENCRYPTION_KEY_FILE: /run/secrets/omni_control_database_key
      VAULT_ROOT: /app/data/vaults
      AUTH_KDF_CONCURRENCY: "${AUTH_KDF_CONCURRENCY:-2}"
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      DATA_AT_REST_MODE: external-encrypted-volume
      DATA_AT_REST_ATTESTATION_FILE: /run/secrets/omni_data_at_rest_attestation.json
      HOST_IP: 0.0.0.0
      PORT: 4000
      SESSION_MAX_AGE_HOURS: "${SESSION_MAX_AGE_HOURS:-8}"
      SESSION_IDLE_TIMEOUT_MINUTES: "${SESSION_IDLE_TIMEOUT_MINUTES:-15}"
      # High-impact actions reuse a password confirmation briefly. This does
      # not cause periodic authentication during ordinary UI activity.
      SESSION_REAUTH_MAX_AGE_MINUTES: "${SESSION_REAUTH_MAX_AGE_MINUTES:-5}"
      SESSION_MAX_CONCURRENT: "${SESSION_MAX_CONCURRENT:-3}"
      # Newt must use 172.30.240.3 on pangolin_target. Keep this /32 narrow.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.30.240.3/32}"
      FORCE_HTTPS: "true"
      ALLOW_INSECURE_HTTP: "false"
      HTTPS_REDIRECT_HOST: "${HTTPS_REDIRECT_HOST:-}"
      # WebAuthn identifiers must match the exact Pangolin public hostname.
      PASSKEY_RP_ID: "${PASSKEY_RP_ID:-}"
      PASSKEY_ORIGINS: "${PASSKEY_ORIGINS:-}"
      # Set this to the exact public Pangolin hostname(s), comma-separated.
      # Empty is allowed through Compose interpolation so compose.local.yaml
      # can supply its loopback allowlist. In the Pangolin base deployment the
      # application itself rejects an empty value before opening a listener.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    secrets:
      - source: omni_data_at_rest_attestation
        target: omni_data_at_rest_attestation.json
      - source: omni_control_database_key
        target: omni_control_database_key
    volumes:
      - type: bind
        source: "${OMNI_DATA_DIR:-./data}"
        target: /app/data
        read_only: false
        bind:
          create_host_path: true
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: "${OMNI_TMPFS_SIZE:-128m}"
          mode: 0o1777

    networks:
      pangolin_target:
        ipv4_address: "${OMNI_MONEY_IP:-172.30.240.2}"

# Compose resolves this host-only extension into the updater's config snapshot;
# it is deliberately not a service secret or container mount.
x-omni-update-attestation-file: "${OMNI_UPDATE_ATTESTATION_FILE:?OMNI_UPDATE_ATTESTATION_FILE is required}"
secrets:
  omni_data_at_rest_attestation:
    file: "${OMNI_AT_REST_ATTESTATION_FILE:?OMNI_AT_REST_ATTESTATION_FILE is required}"
  omni_control_database_key:
    file: "${OMNI_CONTROL_DB_ENCRYPTION_KEY_FILE:?OMNI_CONTROL_DB_ENCRYPTION_KEY_FILE is required}"
networks:
  # Newtを別Composeで動かす場合は、同名のexternal networkとして参照し、
  # Newtへ 172.30.240.3/32 を割り当てる。internalにより、このnetworkから
  # Dockerホスト外への経路は作られない。既存networkやサブネットと衝突する
  # 場合は OMNI_PANGOLIN_SUBNET、OMNI_MONEY_IP、Newtの固定IPを同時に変更し、
  # TRUSTED_PROXIESもNewtの新しい/32へ変更すること。
  pangolin_target:
    name: "${OMNI_PANGOLIN_NETWORK:-omni-money-pangolin}"
    internal: true
    ipam:
      config:
        - subnet: "${OMNI_PANGOLIN_SUBNET:-172.30.240.0/28}"
