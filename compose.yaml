services:
  omni-money:
    build:
      context: .
    image: omni-money:local
    container_name: omni-money
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${OMNI_CPU_LIMIT:-2.0}"
    mem_limit: "${OMNI_MEMORY_LIMIT:-1g}"
    pids_limit: "${OMNI_PIDS_LIMIT:-256}"
    ports:
      # 家計簿Web。外部公開時はリバースプロキシとTLSを使用する。
      - "${OMNI_WEB_BIND_IP:-127.0.0.1}:${OMNI_WEB_PORT:-4000}:4000"
    environment:
      DB_PATH: /app/data/omni_money.db
      TMPDIR: /tmp
      SQLITE_TMPDIR: /tmp
      HOST_IP: 0.0.0.0
      PORT: 4000
      # アプリ内部の待受先とは別に、Dockerホストでの実効公開先を検証する。
      WEB_EXTERNAL_HOST: "${OMNI_WEB_BIND_IP:-127.0.0.1}"
      ALLOW_INSECURE_HTTP: "${ALLOW_INSECURE_HTTP:-false}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:?AUTH_PASSWORD_HASH is required}"
      SESSION_MAX_AGE_HOURS: "${SESSION_MAX_AGE_HOURS:-24}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      HTTPS_REDIRECT_HOST: "${HTTPS_REDIRECT_HOST:-}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    volumes:
      - type: bind
        source: "${OMNI_DATA_DIR:-./data}"
        target: /app/data
        read_only: false
        bind:
          create_host_path: true
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: "${OMNI_TMPFS_SIZE:-128m}"
          mode: 0o1777
