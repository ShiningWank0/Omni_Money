version: '3'
info:
  companyName: ShiningWank0
  productName: Omni Money
  productIdentifier: com.wails.OmniMoney
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, .oss-cache, build/bin]
    file: ['*_test.go']
  git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task frontend
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 60s
        interval: 200ms
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
